<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gallery View V11</title>
<style>
body{margin:0;background:#000000;color:#ffffff;font-family:Arial,sans-serif;overflow:hidden;}#toolbar{position:fixed;top:10px;left:10px;z-index:1000;background:rgba(0,0,0,.75);padding:10px;border-radius:8px;}#viewer{display:flex;justify-content:center;align-items:center;height:100vh;width:100vw;}img{max-width:90vw;max-height:90vh;border:none;cursor:pointer;}button,input,select{margin:4px;}
</style>
</head>
<body>
<div id="toolbar">
<input type="file" id="picker" accept="image/*" multiple>
<input type="file" id="folderPicker" webkitdirectory directory multiple style="display:none;">
<button onclick="document.getElementById('folderPicker').click()">Load Folder</button>
<button onclick="toggleBorder()">Border</button>
<button onclick="toggleBackground()">Background</button>
<button id="playBtn">▶ Play</button>
<button id="pauseBtn">⏸ Pause</button>
<select id="speed"><option value="2000">2 sec</option><option value="5000" selected>5 sec</option><option value="10000">10 sec</option><option value="15000">15 sec</option></select>
<span id="count"></span>
</div>
<div id="viewer"><img id="photo" alt="Gallery image"></div>
<script>
let images=[],current=0,border=false,controlsVisible=true,scale=90,bgMode=0,slideshow=null;
const photo=document.getElementById('photo'),count=document.getElementById('count'),toolbar=document.getElementById('toolbar');
const backgrounds=['#000000','#303030','#505050'];
function updateSize(){photo.style.maxWidth=scale+'vw';photo.style.maxHeight=scale+'vh';}
function showImage(){if(images.length){photo.src=images[current];count.textContent='Photo '+(current+1)+' / '+images.length;}}
function startSlideshow(){stopSlideshow();const speed=parseInt(document.getElementById('speed').value);slideshow=setInterval(()=>{if(images.length){current=(current+1)%images.length;showImage();}},speed);} 
function stopSlideshow(){if(slideshow){clearInterval(slideshow);slideshow=null;}}
function toggleBorder(){border=!border;photo.style.border=border?'1px solid white':'none';}
function toggleBackground(){bgMode=(bgMode+1)%3;document.body.style.background=backgrounds[bgMode];}
function toggleControls(){controlsVisible=!controlsVisible;toolbar.style.display=controlsVisible?'block':'none';}
function handleFiles(files){stopSlideshow();images=[];for(const f of files){if(f.type.startsWith('image/')) images.push(URL.createObjectURL(f));}if(images.length){current=0;showImage();toolbar.style.display='block';controlsVisible=true;}}
document.getElementById('picker').addEventListener('change',e=>handleFiles(e.target.files));
document.getElementById('folderPicker').addEventListener('change',e=>handleFiles(e.target.files));
document.getElementById('playBtn').addEventListener('click',startSlideshow);
document.getElementById('pauseBtn').addEventListener('click',stopSlideshow);
document.getElementById('speed').addEventListener('change',()=>{if(slideshow)startSlideshow();});
document.addEventListener('keydown',e=>{if(e.key==='h'||e.key==='H'){toggleControls();return;}if(e.key==='b'||e.key==='B'){toggleBorder();return;}if(e.key==='g'||e.key==='G'){toggleBackground();return;}if(e.key==='1'){scale=70;updateSize();return;}if(e.key==='2'){scale=80;updateSize();return;}if(e.key==='3'){scale=85;updateSize();return;}if(e.key==='4'){scale=90;updateSize();return;}if(e.key==='+'||e.key==='='){scale=Math.min(95,scale+2);updateSize();return;}if(e.key==='-'||e.key==='_'){scale=Math.max(50,scale-2);updateSize();return;}if(e.code==='Space'){e.preventDefault();if(slideshow)stopSlideshow();else startSlideshow();return;}if(!images.length)return;if(e.key==='ArrowRight'){current=(current+1)%images.length;showImage();}if(e.key==='ArrowLeft'){current=(current-1+images.length)%images.length;showImage();}});
let startX=0;document.addEventListener('touchstart',e=>{startX=e.changedTouches[0].screenX;});document.addEventListener('touchend',e=>{if(!images.length)return;let endX=e.changedTouches[0].screenX;if(endX-startX>50){current=(current-1+images.length)%images.length;}else if(startX-endX>50){current=(current+1)%images.length;}showImage();});
photo.addEventListener('click',()=>toggleControls());updateSize();
</script></body></html>
