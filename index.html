<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101114">
  <title>Luma — Photo Gallery</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #101114;
      color: #f5f5f6;
      font-synthesis: none;
      --muted: #9a9ba3;
      --line: rgba(255,255,255,.09);
      --panel: rgba(28,29,34,.88);
      --accent: #c4f06b;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; overflow: hidden; background: #101114; }
    button { color: inherit; font: inherit; }
    .app { display: grid; grid-template-rows: 72px minmax(0,1fr) 116px; min-height: 100vh; }
    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 20px; padding: 0 28px; border-bottom: 1px solid var(--line); background: rgba(16,17,20,.88); z-index: 2; }
    .brand { display: flex; align-items: center; gap: 11px; min-width: 0; }
    .brand-mark { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 11px; color: #171912; background: var(--accent); font-size: 19px; font-weight: 800; }
    .brand-name { font-size: 15px; font-weight: 700; letter-spacing: -.03em; }
    .brand-subtitle { margin-top: 2px; color: var(--muted); font-size: 11px; }
    .actions { display: flex; align-items: center; gap: 8px; }
    .button { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 38px; padding: 0 13px; border: 1px solid var(--line); border-radius: 10px; background: #202126; cursor: pointer; transition: background .18s, border-color .18s, transform .18s; }
    .button:hover { background: #2b2c32; border-color: rgba(255,255,255,.2); }
    .button:active { transform: scale(.97); }
    .button.primary { border-color: var(--accent); background: var(--accent); color: #171912; font-weight: 700; }
    .button.primary:hover { background: #d3f78e; }
    .button.icon { width: 38px; padding: 0; font-size: 17px; }
    .button:focus-visible, .thumb:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
    .stage { position: relative; display: grid; place-items: center; min-height: 0; padding: 24px; background: radial-gradient(ellipse at center, #202126 0%, #17181c 48%, #111215 100%); }
    .photo-wrap { display: none; width: 100%; height: 100%; align-items: center; justify-content: center; overflow: auto; }
    .photo-wrap.visible { display: flex; }
    #photo { display: block; max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 3px; box-shadow: 0 24px 80px rgba(0,0,0,.36); transform-origin: center; transition: transform .18s ease; user-select: none; -webkit-user-drag: none; }
    .empty { width: min(460px, 100%); padding: 42px 28px; border: 1px dashed rgba(255,255,255,.2); border-radius: 20px; text-align: center; background: rgba(255,255,255,.025); transition: border-color .2s, background .2s; }
    .empty.dragging { border-color: var(--accent); background: rgba(196,240,107,.08); }
    .empty-icon { display: grid; place-items: center; width: 58px; height: 58px; margin: 0 auto 18px; border: 1px solid var(--line); border-radius: 18px; background: #222329; color: var(--accent); font-size: 25px; }
    .empty h1 { margin: 0 0 9px; font-size: clamp(20px,3vw,27px); letter-spacing: -.04em; }
    .empty p { margin: 0 auto 22px; max-width: 320px; color: var(--muted); font-size: 14px; line-height: 1.55; }
    .hint { margin-top: 15px; color: #777982; font-size: 11px; }
    .viewer-controls { position: absolute; right: 22px; bottom: 20px; left: 22px; display: none; align-items: center; justify-content: space-between; gap: 12px; pointer-events: none; }
    .viewer-controls.visible { display: flex; }
    .control-group { display: flex; gap: 7px; pointer-events: auto; }
    .pill { min-height: 38px; display: flex; align-items: center; gap: 8px; padding: 0 13px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); color: #d6d6da; font-size: 12px; backdrop-filter: blur(16px); }
    #zoomLabel { min-width: 48px; justify-content: center; }
    .filmstrip { display: flex; align-items: center; gap: 12px; min-width: 0; padding: 13px 22px; border-top: 1px solid var(--line); background: #15161a; }
    .filmstrip-label { flex: 0 0 auto; width: 90px; color: var(--muted); font-size: 11px; line-height: 1.5; }
    .filmstrip-label strong { display: block; color: #e7e7e9; font-size: 12px; font-weight: 600; }
    .thumbs { display: flex; flex: 1; align-items: center; gap: 9px; min-width: 0; height: 88px; overflow-x: auto; scrollbar-width: thin; scrollbar-color: #44454b transparent; }
    .thumb { position: relative; flex: 0 0 76px; height: 76px; padding: 0; overflow: hidden; border: 1px solid transparent; border-radius: 9px; background: #25262b; cursor: pointer; opacity: .63; transition: opacity .16s, border-color .16s, transform .16s; }
    .thumb:hover { opacity: .9; transform: translateY(-2px); }
    .thumb.active { border: 2px solid var(--accent); opacity: 1; }
    .thumb img { width: 100%; height: 100%; object-fit: cover; }
    .thumb-number { position: absolute; right: 4px; bottom: 4px; padding: 2px 5px; border-radius: 5px; background: rgba(0,0,0,.68); color: white; font-size: 10px; }
    .filmstrip-empty { color: #777982; font-size: 12px; }
    input[type="file"] { display: none; }
    @media (max-width: 640px) {
      .app { grid-template-rows: 62px minmax(0,1fr) 100px; }
      .topbar { padding: 0 13px; gap: 8px; }
      .brand-subtitle { display: none; }
      .actions { gap: 5px; }
      .button { min-height: 35px; padding: 0 10px; font-size: 12px; }
      .button.icon { width: 35px; padding: 0; }
      .stage { padding: 12px; }
      .filmstrip { gap: 8px; padding: 9px 12px; }
      .filmstrip-label { width: 62px; font-size: 10px; }
      .thumbs { height: 78px; gap: 7px; }
      .thumb { flex-basis: 62px; height: 62px; }
      .viewer-controls { right: 12px; bottom: 12px; left: 12px; }
      .pill { min-height: 34px; padding: 0 10px; }
    }
    @media (max-width: 390px) { .brand-name { font-size: 13px; } .button .label { display: none; } }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand" aria-label="Luma photo gallery">
        <div class="brand-mark" aria-hidden="true">L</div>
        <div><div class="brand-name">Luma Gallery</div><div class="brand-subtitle">A little space for your pictures</div></div>
      </div>
      <div class="actions">
        <button class="button" id="folderButton" type="button" title="Open a folder">▤ <span class="label">Open folder</span></button>
        <button class="button primary" id="filesButton" type="button">＋ <span class="label">Add photos</span></button>
      </div>
    </header>

    <section class="stage" id="stage" aria-label="Photo viewer">
      <div class="empty" id="emptyState">
        <div class="empty-icon" aria-hidden="true">▧</div>
        <h1>Your gallery starts here</h1>
        <p>Choose some photos or drop them anywhere in this window. Your images stay on your device.</p>
        <button class="button primary" id="emptyOpenButton" type="button">＋ Add photos</button>
        <div class="hint">J / ← previous &nbsp; · &nbsp; K / → next &nbsp; · &nbsp; F fullscreen</div>
      </div>
      <div class="photo-wrap" id="photoWrap"><img id="photo" alt="Selected gallery photo"></div>
      <div class="viewer-controls" id="viewerControls">
        <div class="control-group">
          <button class="button icon" id="prevButton" type="button" aria-label="Previous photo" title="Previous (←)">‹</button>
          <button class="button icon" id="nextButton" type="button" aria-label="Next photo" title="Next (→)">›</button>
          <div class="pill" id="counter" aria-live="polite">0 / 0</div>
        </div>
        <div class="control-group">
          <button class="button icon" id="zoomOutButton" type="button" aria-label="Zoom out" title="Zoom out (−)">−</button>
          <div class="pill" id="zoomLabel">Fit</div>
          <button class="button icon" id="zoomInButton" type="button" aria-label="Zoom in" title="Zoom in (+)">＋</button>
          <button class="button icon" id="fullscreenButton" type="button" aria-label="Toggle fullscreen" title="Fullscreen (F)">⛶</button>
        </div>
      </div>
    </section>

    <footer class="filmstrip">
      <div class="filmstrip-label"><strong id="photoCount">No photos</strong><span>in this gallery</span></div>
      <div class="thumbs" id="thumbs" aria-label="Photo thumbnails"><span class="filmstrip-empty">Your selected photos will appear here</span></div>
    </footer>
  </main>

  <input type="file" id="picker" accept="image/*" multiple>
  <input type="file" id="folderPicker" accept="image/*" webkitdirectory directory multiple>

  <script>
    const picker = document.getElementById('picker');
    const folderPicker = document.getElementById('folderPicker');
    const photo = document.getElementById('photo');
    const photoWrap = document.getElementById('photoWrap');
    const emptyState = document.getElementById('emptyState');
    const viewerControls = document.getElementById('viewerControls');
    const thumbs = document.getElementById('thumbs');
    const counter = document.getElementById('counter');
    const photoCount = document.getElementById('photoCount');
    const zoomLabel = document.getElementById('zoomLabel');
    let images = [];
    let current = 0;
    let zoom = 1;
    let touchStartX = 0;

    function openPicker(input) { input.click(); }
    document.getElementById('filesButton').addEventListener('click', () => openPicker(picker));
    document.getElementById('emptyOpenButton').addEventListener('click', () => openPicker(picker));
    document.getElementById('folderButton').addEventListener('click', () => openPicker(folderPicker));
    picker.addEventListener('change', event => loadFiles(event.target.files));
    folderPicker.addEventListener('change', event => loadFiles(event.target.files));

    function loadFiles(fileList) {
      const files = Array.from(fileList).filter(file => file.type.startsWith('image/'));
      if (!files.length) return;
      images.forEach(image => URL.revokeObjectURL(image.url));
      images = files.sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true, sensitivity: 'base' }))
        .map(file => ({ name: file.webkitRelativePath || file.name, url: URL.createObjectURL(file) }));
      current = 0;
      buildThumbnails();
      showImage();
      picker.value = '';
      folderPicker.value = '';
    }

    function buildThumbnails() {
      thumbs.replaceChildren();
      images.forEach((image, index) => {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'thumb';
        button.setAttribute('aria-label', `Show photo ${index + 1}: ${image.name}`);
        button.title = image.name;
        const thumbnail = document.createElement('img');
        thumbnail.src = image.url;
        thumbnail.alt = '';
        const number = document.createElement('span');
        number.className = 'thumb-number';
        number.textContent = String(index + 1);
        button.append(thumbnail, number);
        button.addEventListener('click', () => { current = index; showImage(); });
        thumbs.append(button);
      });
      photoCount.textContent = `${images.length} photo${images.length === 1 ? '' : 's'}`;
    }

    function showImage() {
      if (!images.length) return;
      photo.src = images[current].url;
      photo.alt = images[current].name;
      counter.textContent = `${current + 1} / ${images.length}`;
      emptyState.hidden = true;
      photoWrap.classList.add('visible');
      viewerControls.classList.add('visible');
      zoom = 1;
      updateZoom();
      const active = thumbs.children[current];
      if (active) {
        thumbs.querySelector('.active')?.classList.remove('active');
        active.classList.add('active');
        active.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'nearest' });
      }
    }

    function move(step) {
      if (!images.length) return;
      current = (current + step + images.length) % images.length;
      showImage();
    }
    function updateZoom() {
      photo.style.transform = `scale(${zoom})`;
      zoomLabel.textContent = zoom === 1 ? 'Fit' : `${Math.round(zoom * 100)}%`;
    }
    function changeZoom(amount) {
      zoom = Math.min(3, Math.max(.5, Math.round((zoom + amount) * 100) / 100));
      updateZoom();
    }
    document.getElementById('prevButton').addEventListener('click', () => move(-1));
    document.getElementById('nextButton').addEventListener('click', () => move(1));
    document.getElementById('zoomOutButton').addEventListener('click', () => changeZoom(-.2));
    document.getElementById('zoomInButton').addEventListener('click', () => changeZoom(.2));
    document.getElementById('fullscreenButton').addEventListener('click', toggleFullscreen);

    function toggleFullscreen() {
      if (!document.fullscreenElement) document.documentElement.requestFullscreen?.();
      else document.exitFullscreen?.();
    }
    document.addEventListener('keydown', event => {
      if (event.target.matches('input, button')) return;
      if (event.key === 'ArrowLeft' || event.key.toLowerCase() === 'j') move(-1);
      else if (event.key === 'ArrowRight' || event.key.toLowerCase() === 'k') move(1);
      else if (event.key === '+' || event.key === '=') changeZoom(.2);
      else if (event.key === '-') changeZoom(-.2);
      else if (event.key === '0') { zoom = 1; updateZoom(); }
      else if (event.key.toLowerCase() === 'f') toggleFullscreen();
    });

    const stage = document.getElementById('stage');
    stage.addEventListener('dragover', event => { event.preventDefault(); emptyState.classList.add('dragging'); });
    stage.addEventListener('dragleave', event => { if (!stage.contains(event.relatedTarget)) emptyState.classList.remove('dragging'); });
    stage.addEventListener('drop', event => {
      event.preventDefault();
      emptyState.classList.remove('dragging');
      loadFiles(event.dataTransfer.files);
    });
    stage.addEventListener('touchstart', event => { touchStartX = event.changedTouches[0].screenX; }, { passive: true });
    stage.addEventListener('touchend', event => {
      const distance = event.changedTouches[0].screenX - touchStartX;
      if (Math.abs(distance) > 50) move(distance > 0 ? -1 : 1);
    }, { passive: true });
    window.addEventListener('beforeunload', () => images.forEach(image => URL.revokeObjectURL(image.url)));
  </script>
</body>
</html>
